<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen flex flex-col">
<!-- Top App Bar (Simplified for Onboarding) -->
<header class="flex justify-between items-center px-margin-mobile h-touch-target-min w-full bg-surface">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="grid_view">grid_view</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">StockMesh</h1>
</div>
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors">SKIP</button>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pb-12">
<!-- Hero Illustration Area -->
<div class="relative w-full max-w-sm aspect-square mb-12 flex items-center justify-center">
<!-- Background Decoration -->
<div class="absolute inset-0 bg-surface-container rounded-[2.5rem] rotate-3 scale-95 opacity-50"></div>
<div class="absolute inset-0 bg-primary-container/5 rounded-[2.5rem] -rotate-2"></div>
<!-- Main Illustration Image -->
<div class="relative z-10 w-4/5 h-4/5 bg-surface-container-low rounded-xl shadow-sm border border-outline-variant overflow-hidden">
<div class="absolute inset-0 w-full h-full bg-cover bg-center animate-float" data-alt="A clean, minimalist 3D isometric illustration of a small boutique storefront with a classic green awning and large glass windows showing neatly arranged inventory shelves. In front of the shop, a floating holographic symbol of a wireless signal with a strike-through line glows softly, indicating no connection is required. The lighting is bright and airy with a professional light-mode aesthetic, utilizing a palette of crisp white, soft grays, and corporate emerald green accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqcfDX7Ma2tPrVsd3vi9MiyTZOiCMNYA9rOCjrvPqvVP_1cbchNZLZzgwvUlcyBnHNOYZvnhdgxJseLAY8vM52Qz26gusAbLo26UlrwVHdhVXl44vSjMz7O8eVS1J3CmR9w6HBJqZewPGyzrRJ61ZCnZXphHgAsjNbrP0JNv3TR-38tkNcSetBGrq2DXmfoYTzU10T1fxaot9KDsNu2qzpeyRC5dkqw9gkczPeHLMjYO14OR4Z3YFV')">
</div>
<!-- Connectivity Ribbon Overlay -->
<div class="absolute top-4 left-4 bg-surface/90 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="wifi_off">wifi_off</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Local Mode</span>
</div>
</div>
<!-- Floating Floating Elements -->
<div class="absolute -top-4 -right-2 z-20 bg-primary-fixed text-on-primary-fixed px-4 py-2 rounded-xl shadow-lg animate-bounce duration-[3000ms]">
<span class="material-symbols-outlined align-middle mr-1" data-icon="security">security</span>
<span class="font-label-sm text-label-sm font-bold">Data Stays Local</span>
</div>
</div>
<!-- Content Area -->
<div class="text-center max-w-xs space-y-4">
<h2 class="font-display-lg text-headline-lg text-on-surface tracking-tight">Fully Offline.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Your data stays on your device. Manage inventory without an internet connection.
            </p>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="px-margin-mobile pb-10 flex flex-col items-center gap-8">
<!-- Progress Indicators -->
<div class="flex gap-2">
<div class="w-8 h-2.5 rounded-full bg-primary shadow-sm transition-all duration-300"></div>
<div class="w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-300"></div>
<div class="w-2.5 h-2.5 rounded-full bg-outline-variant transition-all duration-300"></div>
</div>
<!-- Action Button -->
<button class="w-full max-w-sm h-touch-target-min bg-primary hover:bg-primary-container text-on-primary font-title-md text-title-md rounded-full shadow-md active:scale-95 transition-all duration-150 flex items-center justify-center gap-2 group" onclick="handleNext()">
<span>Next</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
<!-- Interactive Layer -->
<script>
        function handleNext() {
            // Logic for navigating to next onboarding screen
            console.log('Navigating to Screen 2...');
            const btn = document.querySelector('button[onclick="handleNext()"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span>';
            setTimeout(() => {
                // Mock transition
                document.body.classList.add('opacity-0');
                btn.style.transform = 'scale(0.9)';
            }, 300);
        }

        // Add subtle parallax effect on mouse move for desktop
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                const hero = document.querySelector('.relative.z-10');
                if(hero) hero.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
</body></html>
