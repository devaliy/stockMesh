<!DOCTYPE html>

<title>StockMesh - Get Started</title>

            "borderRadius": {

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .selection-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .selection-card:active {
            transform: scale(0.98);
        }
        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            transition: all 0.3s ease;
        }
        .step-dot.active {
            width: 24px;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center overflow-x-hidden">
<!-- Top Navigation Anchor (Suppressing Shared Nav for Onboarding) -->
<header class="w-full flex justify-between items-center px-margin-mobile h-touch-target-min fixed top-0 z-10">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">
            StockMesh
        </div>
<button class="text-label-sm font-label-sm text-on-surface-variant hover:bg-surface-container-low px-4 py-2 rounded-full transition-colors active:scale-95">
            EXIT
        </button>
</header>
<main class="flex-1 w-full max-w-md mx-auto pt-20 px-margin-mobile flex flex-col">
<!-- Illustration Section -->
<div class="relative w-full aspect-square mb-8 rounded-3xl overflow-hidden bg-surface-container-low">
<div class="w-full h-full bg-cover bg-center" data-alt="A professional 3D isometric illustration of a sleek warehouse management hub with floating translucent data screens and glowing green emerald accents. The scene is bright and airy with high-key lighting, emphasizing a clean minimalist aesthetic. Two distinct human avatars represent different roles, one wearing a suit and another in professional work attire, standing near a large digital gate that radiates a welcoming soft white glow." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBXHKS5aEnUSiIUf8gT262uIzae3Y99agsraEj635Fvik8-nPa_73prwVESZ0n_7LyfIyMzJ6vGBvAvu7l1Ch70q8PKpEhWU9Yetb0_JjlKzSI_-LRuBxz07qy4E4pMpB1baYbWilmfA1NDkdd2zwhf27gafscaHd110eItxTmQAA4xhR3g96gdMvKOPrAYya1KH2UOOwVERzDyfmeQx5Rm5TZ7La9AaLDBaUYePp6bLl9NVB5q21nt')"></div>
<!-- Floating Sync Status Indicator (Design System Signature) -->
<div class="absolute top-4 right-4 bg-surface-container-lowest/80 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-2 border border-outline-variant/30">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-label-sm font-label-sm text-on-surface">Ready to Sync</span>
</div>
</div>
<!-- Copy Section -->
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 tracking-tight">Ready to grow?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose your path to begin managing inventory with precision and scale.</p>
</div>
<!-- Role Selection Cards -->
<div class="space-y-4 mb-12">
<!-- Business Owner Card -->
<button class="selection-card w-full text-left p-5 rounded-xl bg-surface-container-lowest border border-outline-variant hover:border-primary hover:bg-primary-container/[0.04] group">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-lg bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[32px]">hub</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">I am the Business Owner</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 leading-snug">Register a new business entity and set up your master inventory hub.</p>
</div>
<span class="material-symbols-outlined text-outline-variant self-center group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
</div>
</button>
<!-- Staff/Worker Card -->
<button class="selection-card w-full text-left p-5 rounded-xl bg-surface-container-lowest border border-outline-variant hover:border-secondary hover:bg-secondary-container/[0.04] group">
<div class="flex items-start gap-4">
<div class="w-12 h-12 rounded-lg bg-secondary/10 flex items-center justify-center text-secondary group-hover:bg-secondary group-hover:text-on-secondary transition-colors">
<span class="material-symbols-outlined text-[32px]">person_add</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface group-hover:text-secondary transition-colors">Join an Existing Business</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 leading-snug">Use an invite code or search for your organization to join as a staff member.</p>
</div>
<span class="material-symbols-outlined text-outline-variant self-center group-hover:text-secondary group-hover:translate-x-1 transition-all">chevron_right</span>
</div>
</button>
</div>
<!-- Pagination & Actions -->
<div class="mt-auto pb-8 flex flex-col items-center gap-8">
<!-- Step Indicators -->
<div class="flex gap-2">
<div class="step-dot bg-outline-variant"></div>
<div class="step-dot bg-outline-variant"></div>
<div class="step-dot active bg-primary"></div>
</div>
<!-- Accessibility Note -->
<p class="text-label-sm font-label-sm text-outline text-center px-4">
                By continuing, you agree to StockMesh’s <span class="text-primary font-semibold underline underline-offset-4 decoration-primary/30">Terms of Service</span> and <span class="text-primary font-semibold underline underline-offset-4 decoration-primary/30">Privacy Policy</span>.
            </p>
</div>
</main>
<!-- Optional Connectivity Ribbon (Design System Anchor) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-highest px-4 py-1.5 flex items-center justify-center gap-2 transform translate-y-full transition-transform duration-500" id="offline-ribbon">
<span class="material-symbols-outlined text-[18px] text-outline">wifi_off</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Local Mode Active — Data will sync when back online.</span>
</div>
<script>
        // Micro-interactions for role selection
        const cards = document.querySelectorAll('.selection-card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Visual feedback before navigation
                card.classList.add('ring-2', 'ring-primary/20');
                setTimeout(() => {
                    // Logic for navigation would go here
                    console.log('Role Selected:', card.querySelector('h3').innerText);
                }, 300);
            });
        });

        // Simulate Connectivity Ribbon entrance for "Offline-First" branding
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ribbon = document.getElementById('offline-ribbon');
                // ribbon.classList.remove('translate-y-full'); // Uncomment to show persistent sync ribbon
            }, 1000);
        });
    </script>
</body></html>
