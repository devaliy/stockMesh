<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
            overflow: hidden;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .shimmer-bar {
            position: relative;
            overflow: hidden;
            background: #e5eeff;
            height: 4px;
            width: 140px;
            border-radius: 9999px;
        }

        .shimmer-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, transparent, #006b2c, transparent);
            animation: shimmer 1.5s infinite ease-in-out;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scale-in {
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-surface">
<!-- Splash Screen Container -->
<main class="relative flex flex-col items-center justify-center w-full max-w-md px-margin-mobile text-center h-screen">
<!-- Center Content Group -->
<div class="flex flex-col items-center space-y-6 scale-in">
<!-- Logo Section -->
<div class="relative w-24 h-24 flex items-center justify-center bg-white rounded-3xl shadow-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">
                    inventory_2
                </span>
<!-- Subtle decorative orbit around logo -->
<div class="absolute -inset-2 border border-primary/10 rounded-full animate-[spin_10s_linear_infinite]"></div>
</div>
<!-- Brand Name -->
<div class="space-y-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-extrabold tracking-tight text-on-surface">
                    StockMesh
                </h1>
<div class="shimmer-bar mx-auto mt-4">
<div class="shimmer-progress"></div>
</div>
</div>
</div>
<!-- Tagline & Status (Bottom Anchored) -->
<div class="absolute bottom-16 w-full px-margin-mobile flex flex-col items-center space-y-4 fade-in">
<p class="font-body-md text-body-md text-on-surface-variant font-medium">
                Offline-first inventory. No cloud required.
            </p>
<!-- Contextual Connectivity Ribbon (from Style Guidance) -->
<div class="flex items-center space-y-1 bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant/20">
<span class="material-symbols-outlined text-[18px] text-primary mr-2" data-icon="cloud_off">
                    cloud_off
                </span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                    Local Mode Active
                </span>
</div>
</div>
<!-- Ambient Background Decoration (Asymmetric/Modern Layout) -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-fixed-dim/10 rounded-full blur-3xl -z-10 translate-x-1/2 -translate-y-1/2"></div>
<div class="absolute bottom-0 left-0 w-96 h-96 bg-secondary-fixed/10 rounded-full blur-3xl -z-10 -translate-x-1/2 translate-y-1/2"></div>
</main>
<!-- Background Graphics / Content Image Support -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] -z-20 overflow-hidden">
<div class="w-full h-full bg-center bg-cover" data-alt="A minimalist architectural blueprint overlay on a clean off-white background. The scene features light gray geometric lines and technical grids representing warehouse precision and inventory organization. The overall aesthetic is high-fidelity Corporate Modernism with a bright, airy feel." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBasdNIHIVRb1GAk4YrGNP29sj1YglPrkK_xVVkUJyAxcExLEJP9wvaKdJsl8ueYtcG9LEFYMT97wJdZmNPuPt7pXoZ34yW4e6X7VwMD1BPxq6BMTPdNbX-TiYi7RfJDOnbF1MLDh1XRVxdYablIGPkRXlpVmhPPxCJId6ly2aW7vSk7im1_GJYrr9gTBQJeyhSR1Ndj3SRh0w0Udip442hOOtSyakiGS8CwLoz3Q5fsSFP2szO6QDO')"></div>
</div>
<script>
        // Simple micro-interaction for splash transition simulation
        document.addEventListener('DOMContentLoaded', () => {
            console.log('StockMesh Engine initialized in local-first mode.');
            
            // Randomly simulate loading completion or redirection
            setTimeout(() => {
                const bar = document.querySelector('.shimmer-progress');
                if (bar) {
                    bar.style.animation = 'none';
                    bar.style.width = '100%';
                    bar.style.transition = 'width 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                    bar.classList.add('bg-primary');
                }
            }, 3500);
        });
    </script>
