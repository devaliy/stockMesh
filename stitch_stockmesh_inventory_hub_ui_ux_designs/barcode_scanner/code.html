<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StockMesh | Barcode Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .scanner-laser {
      background: linear-gradient(to bottom, transparent, #006b2c, transparent);
      height: 2px;
      width: 100%;
      position: absolute;
      top: 0;
      animation: scan 2.5s infinite ease-in-out;
    }
    @keyframes scan {
      0% { top: 0; }
      50% { top: 100%; }
      100% { top: 0; }
    }
    .corner-bracket {
      width: 32px;
      height: 32px;
      border-color: #006b2c;
      position: absolute;
    }
    .bracket-tl { border-top-width: 4px; border-left-width: 4px; top: -2px; left: -2px; border-radius: 4px 0 0 0; }
    .bracket-tr { border-top-width: 4px; border-right-width: 4px; top: -2px; right: -2px; border-radius: 0 4px 0 0; }
    .bracket-bl { border-bottom-width: 4px; border-left-width: 4px; bottom: -2px; left: -2px; border-radius: 0 0 0 4px; }
    .bracket-br { border-bottom-width: 4px; border-right-width: 4px; bottom: -2px; right: -2px; border-radius: 0 0 4px 0; }
    
    .glass-panel {
      backdrop-filter: blur(12px);
      background: rgba(248, 249, 255, 0.7);
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-secondary-fixed": "#00174b",
            "surface-container-highest": "#d3e4fe",
            "secondary-fixed": "#dbe1ff",
            "surface-container": "#e5eeff",
            "primary-fixed": "#7ffc97",
            "on-tertiary-container": "#fffbff",
            "on-surface-variant": "#3e4a3d",
            "surface-dim": "#cbdbf5",
            "tertiary-container": "#8a4cfc",
            "inverse-primary": "#62df7d",
            "primary-container": "#00873a",
            "on-tertiary-fixed": "#25005a",
            "outline-variant": "#bdcaba",
            "on-surface": "#0b1c30",
            "on-secondary-container": "#fefcff",
            "surface-container-lowest": "#ffffff",
            "on-primary": "#ffffff",
            "on-error-container": "#93000a",
            "tertiary-fixed-dim": "#d2bbff",
            "surface-container-low": "#eff4ff",
            "error-container": "#ffdad6",
            "primary": "#006b2c",
            "on-secondary": "#ffffff",
            "surface": "#f8f9ff",
            "error": "#ba1a1a",
            "surface-variant": "#d3e4fe",
            "on-primary-fixed": "#002109",
            "secondary-fixed-dim": "#b4c5ff",
            "on-tertiary": "#ffffff",
            "on-secondary-fixed-variant": "#003ea8",
            "secondary-container": "#316bf3",
            "on-primary-fixed-variant": "#005320",
            "on-background": "#0b1c30",
            "tertiary-fixed": "#eaddff",
            "surface-tint": "#006e2d",
            "secondary": "#0051d5",
            "inverse-on-surface": "#eaf1ff",
            "inverse-surface": "#213145",
            "primary-fixed-dim": "#62df7d",
            "on-tertiary-fixed-variant": "#5a00c6",
            "surface-bright": "#f8f9ff",
            "outline": "#6e7b6c",
            "on-error": "#ffffff",
            "tertiary": "#712ae2",
            "on-primary-container": "#f7fff2",
            "surface-container-high": "#dce9ff",
            "background": "#f8f9ff"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin-mobile": "16px",
            "margin-tablet": "24px",
            "touch-target-min": "48px",
            "gutter": "16px",
            "base": "8px"
          },
          "fontFamily": {
            "headline-lg-mobile": ["Inter"],
            "display-lg": ["Inter"],
            "body-md": ["Inter"],
            "title-md": ["Inter"],
            "label-sm": ["Inter"],
            "headline-lg": ["Inter"]
          },
          "fontSize": {
            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
            "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
            "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-background text-on-background font-body-md text-body-md overflow-hidden">
<!-- Full Screen Camera View (Simulated with high-fidelity image) -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center grayscale-[20%] contrast-125" data-alt="A professional warehouse environment seen through a high-resolution camera lens with shallow depth of field. Industrial metal shelving units filled with organized boxes and inventory items are visible in the background under bright, clean white LED warehouse lighting. The visual style is crisp, reliable, and corporate modern, emphasizing a sophisticated logistics and stock management operation." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAhnXf5by_NwOZfm1P7SCrkHu1Z4KCJYzxklQmlSbmDxaunSTOcoV17V3Vy39n6PcKrPXQiJAOJWKBgefURwrVV0Ykysse4-nMduBFFhAt2mRNGom7vgSyZ-oI9ALHZ_kN7quSmlWOenHTUFx9VYYyOqX-IB0XzYkRujZ330SeeKS6tKI7rjqkEcDiJckN9Zd7BblE-tbZNG2xY0biLlvB90VPNqAAEcYWcOC9i-ecSGhHoCET8IV6_')"></div>
<div class="absolute inset-0 bg-black/30"></div>
</div>
<!-- Top Controls Layer -->
<div class="fixed top-0 left-0 right-0 z-20 px-margin-mobile pt-10 flex justify-between items-center">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-black/40 text-white active:scale-95 transition-transform" onclick="window.history.back()">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex gap-4">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-black/40 text-white active:scale-95 transition-transform" id="torch-toggle" onclick="toggleTorch()">
<span class="material-symbols-outlined" id="torch-icon">flashlight_on</span>
</button>
<button class="px-6 h-12 flex items-center justify-center gap-2 rounded-full bg-primary text-on-primary font-bold active:scale-95 transition-transform">
<span class="material-symbols-outlined">keyboard</span>
<span class="hidden sm:inline">Manual Entry</span>
</button>
</div>
</div>
<!-- Scanner Overlay / Viewport -->
<div class="fixed inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
<div class="relative w-72 h-72 sm:w-80 sm:h-80">
<!-- Brackets -->
<div class="corner-bracket bracket-tl"></div>
<div class="corner-bracket bracket-tr"></div>
<div class="corner-bracket bracket-bl"></div>
<div class="corner-bracket bracket-br"></div>
<!-- Scanning Line Animation -->
<div class="scanner-laser"></div>
<!-- Guidance Text -->
<div class="absolute -bottom-16 left-0 right-0 text-center text-white/90 font-medium">
        Align barcode within frame
      </div>
</div>
</div>
<!-- Recent Scans Bottom Sheet -->
<div class="fixed bottom-0 left-0 right-0 z-30 transition-all duration-500 ease-out translate-y-[calc(100%-84px)]" id="bottom-sheet">
<div class="mx-auto max-w-lg">
<div class="glass-panel rounded-t-3xl shadow-2xl border-t border-white/20 overflow-hidden">
<!-- Sheet Handle -->
<div class="w-full flex justify-center py-3 cursor-grab" id="sheet-handle">
<div class="w-12 h-1.5 bg-on-surface/20 rounded-full"></div>
</div>
<!-- Header -->
<div class="px-6 pb-4 flex justify-between items-center">
<h2 class="font-title-md text-title-md text-on-surface">Recent Scans</h2>
<span class="text-label-sm font-label-sm bg-primary-container/20 text-primary px-3 py-1 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">sync</span>
            Synced
          </span>
</div>
<!-- Scans List -->
<div class="px-margin-mobile pb-10 space-y-4 max-h-[60vh] overflow-y-auto">
<!-- Scan Item 1 -->
<div class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30">
<div class="w-12 h-12 rounded-lg bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined">inventory_2</span>
</div>
<div class="flex-1">
<div class="font-semibold text-on-surface">Precision Bolt Set</div>
<div class="text-on-surface-variant text-sm">SKU: BOLT-992-X</div>
</div>
<div class="text-right">
<div class="font-bold text-primary">+240</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-wider">Stock In</div>
</div>
</div>
<!-- Scan Item 2 -->
<div class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">package_2</span>
</div>
<div class="flex-1">
<div class="font-semibold text-on-surface">Industrial Filter</div>
<div class="text-on-surface-variant text-sm">SKU: FLTR-045</div>
</div>
<div class="text-right">
<div class="font-bold text-error">-12</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-wider">Dispatched</div>
</div>
</div>
<!-- Scan Item 3 -->
<div class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">shelves</span>
</div>
<div class="flex-1">
<div class="font-semibold text-on-surface">Lubricant XL-40</div>
<div class="text-on-surface-variant text-sm">SKU: LUB-9011</div>
</div>
<div class="text-right">
<div class="font-bold text-primary">+15</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-wider">Received</div>
</div>
</div>
<!-- Scan Item 4 -->
<div class="flex items-center gap-4 p-4 bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30">
<div class="w-12 h-12 rounded-lg bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">hardware</span>
</div>
<div class="flex-1">
<div class="font-semibold text-on-surface">Steel Washer M10</div>
<div class="text-on-surface-variant text-sm">SKU: WSH-M10</div>
</div>
<div class="text-right">
<div class="font-bold text-primary">+1000</div>
<div class="text-[10px] text-on-surface-variant uppercase tracking-wider">Restock</div>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
    // Bottom Sheet Logic
    const sheet = document.getElementById('bottom-sheet');
    const handle = document.getElementById('sheet-handle');
    let isExpanded = false;

    handle.addEventListener('click', () => {
      isExpanded = !isExpanded;
      if (isExpanded) {
        sheet.classList.remove('translate-y-[calc(100%-84px)]');
        sheet.classList.add('translate-y-0');
      } else {
        sheet.classList.add('translate-y-[calc(100%-84px)]');
        sheet.classList.remove('translate-y-0');
      }
    });

    // Torch Toggle
    let torchOn = false;
    function toggleTorch() {
      torchOn = !torchOn;
      const icon = document.getElementById('torch-icon');
      const btn = document.getElementById('torch-toggle');
      
      if (torchOn) {
        icon.innerText = 'flashlight_off';
        btn.classList.add('bg-white', 'text-primary');
        btn.classList.remove('bg-black/40', 'text-white');
      } else {
        icon.innerText = 'flashlight_on';
        btn.classList.remove('bg-white', 'text-primary');
        btn.classList.add('bg-black/40', 'text-white');
      }
    }

    // Micro-interaction: Simulate "Scan Detected" every 10 seconds
    setInterval(() => {
      const laser = document.querySelector('.scanner-laser');
      const brackets = document.querySelectorAll('.corner-bracket');
      
      // Flash Green
      brackets.forEach(b => b.style.borderColor = '#7ffc97');
      laser.style.background = '#7ffc97';
      
      setTimeout(() => {
        brackets.forEach(b => b.style.borderColor = '#006b2c');
        laser.style.background = 'linear-gradient(to bottom, transparent, #006b2c, transparent)';
      }, 300);
    }, 8000);
  </script>
</body></html>
