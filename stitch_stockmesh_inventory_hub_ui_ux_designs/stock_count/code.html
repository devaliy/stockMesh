<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StockMesh | Stock Count</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .numeric-input::-webkit-outer-spin-button,
        .numeric-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .numeric-input {
            -moz-appearance: textfield;
        }
        .sync-dot-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#00174b",
                        "surface-container-highest": "#d3e4fe",
                        "secondary-fixed": "#dbe1ff",
                        "surface-container": "#e5eeff",
                        "primary-fixed": "#7ffc97",
                        "on-tertiary-container": "#fffbff",
                        "on-surface-variant": "#3e4a3d",
                        "surface-dim": "#cbdbf5",
                        "tertiary-container": "#8a4cfc",
                        "inverse-primary": "#62df7d",
                        "primary-container": "#00873a",
                        "on-tertiary-fixed": "#25005a",
                        "outline-variant": "#bdcaba",
                        "on-surface": "#0b1c30",
                        "on-secondary-container": "#fefcff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#d2bbff",
                        "surface-container-low": "#eff4ff",
                        "error-container": "#ffdad6",
                        "primary": "#006b2c",
                        "on-secondary": "#ffffff",
                        "surface": "#f8f9ff",
                        "error": "#ba1a1a",
                        "surface-variant": "#d3e4fe",
                        "on-primary-fixed": "#002109",
                        "secondary-fixed-dim": "#b4c5ff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#003ea8",
                        "secondary-container": "#316bf3",
                        "on-primary-fixed-variant": "#005320",
                        "on-background": "#0b1c30",
                        "tertiary-fixed": "#eaddff",
                        "surface-tint": "#006e2d",
                        "secondary": "#0051d5",
                        "inverse-on-surface": "#eaf1ff",
                        "inverse-surface": "#213145",
                        "primary-fixed-dim": "#62df7d",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "surface-bright": "#f8f9ff",
                        "outline": "#6e7b6c",
                        "on-error": "#ffffff",
                        "tertiary": "#712ae2",
                        "on-primary-container": "#f7fff2",
                        "surface-container-high": "#dce9ff",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-tablet": "24px",
                        "touch-target-min": "48px",
                        "gutter": "16px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "title-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="bg-surface shadow-sm docked full-width top-0 z-50">
<div class="flex justify-between items-center px-margin-mobile h-14 w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="inventory_2">inventory_2</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">StockMesh</h1>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-primary-fixed text-on-primary-fixed text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="sync">sync</span>
<span>Synced</span>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full transition-colors" data-icon="sync">sync</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-6 pb-24 max-w-lg mx-auto w-full">
<!-- Batch Progress Header -->
<section class="mb-8">
<div class="flex justify-between items-end mb-2">
<div>
<h2 class="font-title-md text-title-md text-on-surface">Daily Audit</h2>
<p class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">Aisle 4 • Beverages</p>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">12 / 45 Remaining</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary transition-all duration-500 ease-out" style="width: 73%;"></div>
</div>
</section>
<!-- Focused Product Card -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-6 relative overflow-hidden">
<div class="absolute top-4 right-4 flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-primary sync-dot-pulse"></span>
<span class="text-[10px] font-bold text-on-surface-variant uppercase">In Sync</span>
</div>
<div class="mb-8">
<span class="text-label-sm font-label-sm text-secondary bg-secondary-fixed px-2 py-0.5 rounded-md uppercase tracking-tight">SKU: BEV-00421</span>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile mt-2 text-on-surface leading-tight">Organic Cold Brew Coffee 12oz</h3>
<div class="flex items-center gap-4 mt-4">
<div class="flex flex-col">
<span class="text-label-sm font-label-sm text-on-surface-variant">System Stock</span>
<span class="font-headline-lg text-headline-lg text-on-surface-variant" id="system-stock">48</span>
</div>
<div class="h-10 w-[1px] bg-outline-variant"></div>
<div class="flex flex-col">
<span class="text-label-sm font-label-sm text-on-surface-variant">Variance</span>
<span class="font-headline-lg text-headline-lg text-on-surface-variant" id="variance-badge">0</span>
</div>
</div>
</div>
<!-- Numeric Input Section -->
<div class="space-y-4">
<label class="block text-label-sm font-label-sm text-on-surface-variant uppercase" for="actual-count">Actual Count</label>
<div class="flex items-center gap-4">
<button class="w-16 h-16 flex items-center justify-center rounded-xl bg-surface-container-high text-on-surface hover:bg-surface-container-highest active:scale-95 transition-all" onclick="adjustCount(-1)">
<span class="material-symbols-outlined text-3xl" data-icon="remove">remove</span>
</button>
<input class="numeric-input flex-grow h-20 text-center font-display-lg text-display-lg bg-surface border-2 border-outline-variant rounded-xl focus:border-primary focus:ring-0 transition-colors" id="actual-count" oninput="updateVariance()" placeholder="0" type="number"/>
<button class="w-16 h-16 flex items-center justify-center rounded-xl bg-primary text-on-primary hover:bg-primary-container active:scale-95 transition-all" onclick="adjustCount(1)">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Quick Action Tags -->
<div class="flex flex-wrap gap-2 mt-8">
<button class="px-4 py-2 rounded-full border border-outline-variant text-label-sm font-label-sm text-on-surface-variant hover:bg-surface-container transition-colors">Damaged Item</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-label-sm font-label-sm text-on-surface-variant hover:bg-surface-container transition-colors">Expired</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-label-sm font-label-sm text-on-surface-variant hover:bg-surface-container transition-colors">Wrong Location</button>
</div>
</section>
<!-- Navigation / Action Footer (Contextual) -->
<div class="mt-8 flex gap-4">
<button class="flex-1 h-14 rounded-xl border border-outline-variant font-title-md text-title-md text-on-surface-variant flex items-center justify-center gap-2 hover:bg-surface-container transition-all active:scale-95">
<span class="material-symbols-outlined" data-icon="skip_next">skip_next</span>
                Skip
            </button>
<button class="flex-[2] h-14 rounded-xl bg-primary text-on-primary font-title-md text-title-md flex items-center justify-center gap-2 shadow-lg hover:shadow-xl active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                Confirm Count
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Top-level Context) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-2 bg-surface-container-low border-t border-outline-variant shadow-lg md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-sm text-label-sm">Products</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
<span class="font-label-sm text-label-sm">Sell</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
<span class="font-label-sm text-label-sm">Reports</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
<script>
        const input = document.getElementById('actual-count');
        const systemStockVal = 48;
        const varianceBadge = document.getElementById('variance-badge');

        function adjustCount(amount) {
            let current = parseInt(input.value) || 0;
            input.value = Math.max(0, current + amount);
            updateVariance();
            // Simple visual feedback
            input.classList.add('scale-105');
            setTimeout(() => input.classList.remove('scale-105'), 100);
        }

        function updateVariance() {
            let actual = parseInt(input.value) || 0;
            let variance = actual - systemStockVal;
            
            varianceBadge.textContent = variance > 0 ? `+${variance}` : variance;
            
            if (variance === 0) {
                varianceBadge.className = 'font-headline-lg text-headline-lg text-on-surface-variant';
            } else if (variance > 0) {
                varianceBadge.className = 'font-headline-lg text-headline-lg text-primary font-bold';
            } else {
                varianceBadge.className = 'font-headline-lg text-headline-lg text-error font-bold';
            }
        }

        // Initialize with system stock to start at 0 variance
        input.value = systemStockVal;
        updateVariance();
    </script>
</body></html>
