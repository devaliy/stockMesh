        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        
        .success-pulse {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        .check-draw {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw 0.8s ease-out forwards 0.2s;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        .float-subtle {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>

<!-- Success Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle parallax for the success card
            const card = document.querySelector('.bg-surface-container-lowest');
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            // Re-draw checkmark on click for flair
            const checkIcon = document.querySelector('.check-draw');
            document.querySelector('.w-32').addEventListener('click', () => {
                checkIcon.style.animation = 'none';
                void checkIcon.offsetWidth; // trigger reflow
                checkIcon.style.animation = 'draw 0.8s ease-out forwards';
            });
        });
    </script>
