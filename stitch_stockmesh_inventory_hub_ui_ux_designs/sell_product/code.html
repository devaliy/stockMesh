<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>StockMesh POS - Quick Sale</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        /* Custom scrollbar for clean UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .active-scale:active {
            transform: scale(0.95);
        }

        /* Safe area for mobile notch/bottom bars */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "primary": "#006b2c",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-tint": "#006e2d",
                        "outline-variant": "#bdcaba",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#003ea8",
                        "secondary-container": "#316bf3",
                        "on-tertiary-container": "#fffbff",
                        "on-error": "#ffffff",
                        "background": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "surface": "#f8f9ff",
                        "tertiary": "#712ae2",
                        "inverse-primary": "#62df7d",
                        "on-background": "#0b1c30",
                        "secondary-fixed": "#dbe1ff",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-container": "#e5eeff",
                        "inverse-surface": "#213145",
                        "surface-variant": "#d3e4fe",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#8a4cfc",
                        "surface-container-highest": "#d3e4fe",
                        "on-primary-container": "#f7fff2",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-primary-fixed-variant": "#005320",
                        "tertiary-fixed": "#eaddff",
                        "primary-fixed-dim": "#62df7d",
                        "outline": "#6e7b6c",
                        "on-surface": "#0b1c30",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#7ffc97",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "tertiary-fixed-dim": "#d2bbff",
                        "on-primary-fixed": "#002109",
                        "on-primary": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "on-surface-variant": "#3e4a3d",
                        "on-secondary-container": "#fefcff",
                        "secondary": "#0051d5",
                        "on-secondary-fixed": "#00174b",
                        "primary-container": "#00873a",
                        "on-tertiary-fixed": "#25005a",
                        "surface-container-low": "#eff4ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "base": "8px",
                        "margin-tablet": "24px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "title-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation Anchor -->
<header class="bg-surface dark:bg-surface flex justify-between items-center px-margin-mobile h-touch-target-min w-full fixed top-0 z-50">
<div class="flex items-center gap-3">
<button class="active:scale-95 duration-150 ease-in-out hover:bg-surface-container-low transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="grid_view">grid_view</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">StockMesh</h1>
</div>
<div class="flex items-center gap-2">
<!-- Offline Status Indicator -->
<div class="flex items-center gap-1.5 px-3 py-1 bg-surface-container-high rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-primary text-[18px]" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Synced</span>
</div>
<button class="active:scale-95 duration-150 ease-in-out hover:bg-surface-container-low transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-primary" data-icon="sync">sync</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Scrollable area between headers/footers) -->
<main class="flex-grow pt-[48px] pb-[88px] w-full max-w-md mx-auto overflow-y-auto px-margin-mobile">
<!-- Product Hero Section -->
<div class="mt-6 relative">
<div class="w-full h-56 rounded-xl overflow-hidden bg-surface-container-low border border-outline-variant/20 shadow-sm">
<img class="w-full h-full object-cover" data-alt="A high-resolution, professional product photograph of a premium ergonomic mechanical keyboard in a modern retail setting. The lighting is crisp and even, highlighting the sleek industrial design and vibrant emerald green keycaps. The background is a clean, minimalist store shelf with soft-focus inventory, maintaining a high-fidelity and corporate-modern aesthetic in light mode." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGOKNwZRCVuzczI8jwfXOyZ_RT5psI6DiMtMjjMM8DHm7xFErMJZCj-s-6BD_PQjN5VaaS9EHrOBkbtsT9_Yh5lshUvRi1kDTrbX0tbfUGtio2ugANYmvvKyyZFXfspSXGMc4zZMtvMwhBnFyMM2Qey-oXRsdV6JlfLq0BK58lLLZ_qulGaVQcMfs0KpTWE25sp4IUl1E-Ek7fFsSOyL6dIDZh92LHeW7KI88dzQ5aIwkQc8dKy4dW"/>
<!-- Sync Status Badge -->
<div class="absolute top-3 right-3 bg-primary w-3 h-3 rounded-full border-2 border-surface shadow-sm"></div>
</div>
</div>
<!-- Product Identity -->
<div class="mt-6 text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Ergo-Flow Mechanical Keyboard</h2>
<div class="flex items-center justify-center gap-2 mt-1">
<span class="text-on-surface-variant font-body-md opacity-70">SKU: SM-4492-ERGO</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span class="text-on-surface-variant font-body-md opacity-70">Stock: 142</span>
</div>
<div class="mt-4 inline-block px-6 py-2 bg-secondary-container rounded-xl">
<p class="font-display-lg text-display-lg text-on-secondary-container" id="displayPrice">$129.00</p>
</div>
</div>
<!-- Quantity & Adjustments -->
<div class="mt-8 flex flex-col gap-6">
<!-- Quantity Selector -->
<div class="flex items-center justify-between bg-surface-container p-2 rounded-2xl border border-outline-variant/50">
<button class="w-16 h-16 flex items-center justify-center bg-surface-container-lowest rounded-xl shadow-sm text-primary active:scale-90 transition-transform" onclick="updateQty(-1)">
<span class="material-symbols-outlined text-[32px]" data-icon="remove">remove</span>
</button>
<div class="text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Quantity</p>
<p class="font-headline-lg text-headline-lg text-on-surface" id="qtyCounter">1</p>
</div>
<button class="w-16 h-16 flex items-center justify-center bg-surface-container-lowest rounded-xl shadow-sm text-primary active:scale-90 transition-transform" onclick="updateQty(1)">
<span class="material-symbols-outlined text-[32px]" data-icon="add">add</span>
</button>
</div>
<!-- Numpad for Price Adjustment / Custom Amount -->
<div class="bg-surface-container-low p-4 rounded-3xl border border-outline-variant/20">
<div class="flex justify-between items-center mb-4 px-2">
<span class="font-title-md text-title-md text-on-surface">Manual Adjustment</span>
<button class="text-secondary font-label-sm uppercase tracking-wider font-bold">Discount %</button>
</div>
<div class="numpad-grid">
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(1)">1</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(2)">2</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(3)">3</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(4)">4</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(5)">5</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(6)">6</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(7)">7</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(8)">8</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(9)">9</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad('.')">.</button>
<button class="h-16 flex items-center justify-center bg-surface rounded-xl font-headline-lg-mobile text-on-surface active:bg-surface-container-highest transition-colors shadow-sm" onclick="numpad(0)">0</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest rounded-xl text-on-surface active:bg-surface-variant transition-colors shadow-sm" onclick="clearPrice()">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
</div>
</div>
</div>
</main>
<!-- Fixed Action Bar (The Confirm Button) -->
<div class="fixed bottom-0 left-0 w-full z-50 px-margin-mobile py-4 bg-surface-container-low/80 backdrop-blur-md pb-safe">
<button class="w-full h-[64px] bg-primary text-on-primary rounded-2xl flex items-center justify-center gap-3 font-title-md text-title-md shadow-xl active:scale-95 transition-all duration-200" id="confirmBtn">
<span class="material-symbols-outlined" data-icon="point_of_sale" style="font-variation-settings: 'FILL' 1;">point_of_sale</span>
            Confirm Sale — <span id="totalText">$129.00</span>
</button>
</div>
<!-- Navigation Overlay Shell (Hiding for POS Focus Mode but keeping script hook) -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-2 py-3 pb-safe bg-surface-container dark:bg-surface-dim shadow-sm rounded-t-xl hidden">
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-4 py-1">
<span class="material-symbols-outlined" data-icon="point_of_sale">point_of_sale</span>
<span class="font-label-sm text-label-sm">Sell</span>
</div>
</nav>
<script>
        let qty = 1;
        let basePrice = 129.00;
        let currentPriceStr = "129.00";
        let isEditingPrice = false;

        function updateQty(delta) {
            qty = Math.max(1, qty + delta);
            document.getElementById('qtyCounter').innerText = qty;
            updateTotals();
        }

        function numpad(val) {
            if (!isEditingPrice) {
                currentPriceStr = "";
                isEditingPrice = true;
            }
            if (val === '.' && currentPriceStr.includes('.')) return;
            currentPriceStr += val;
            document.getElementById('displayPrice').innerText = '$' + currentPriceStr;
            updateTotals();
        }

        function clearPrice() {
            currentPriceStr = currentPriceStr.slice(0, -1);
            if (currentPriceStr === "") {
                currentPriceStr = "0";
                isEditingPrice = false;
            }
            document.getElementById('displayPrice').innerText = '$' + currentPriceStr;
            updateTotals();
        }

        function updateTotals() {
            const price = parseFloat(currentPriceStr) || 0;
            const total = (price * qty).toFixed(2);
            document.getElementById('totalText').innerText = '$' + total;
        }

        // Haptic-like feedback on confirm
        document.getElementById('confirmBtn').addEventListener('click', function() {
            this.classList.add('bg-primary-container');
            const originalText = this.innerHTML;
            this.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> Processing...`;
            
            setTimeout(() => {
                this.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span> Sale Complete`;
                this.classList.remove('bg-primary');
                this.classList.add('bg-tertiary-container');
                
                setTimeout(() => {
                    this.innerHTML = originalText;
                    this.classList.remove('bg-tertiary-container');
                    this.classList.remove('bg-primary-container');
                    this.classList.add('bg-primary');
                    // Reset
                    qty = 1;
                    currentPriceStr = "129.00";
                    isEditingPrice = false;
                    document.getElementById('qtyCounter').innerText = qty;
                    document.getElementById('displayPrice').innerText = '$' + currentPriceStr;
                    updateTotals();
                }, 2000);
            }, 800);
        });
    </script>
</body></html>
