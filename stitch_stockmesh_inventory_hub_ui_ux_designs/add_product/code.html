<body class="bg-surface text-on-surface min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface shadow-sm w-full top-0 sticky z-50 flex justify-between items-center px-margin-mobile h-touch-target-min">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-size: 28px;">inventory_2</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Add Product</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">cloud_done</span>
</div>
</header>
<main class="px-margin-mobile pt-6 max-w-2xl mx-auto">
<!-- Content Canvas -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5 custom-shadow">
<form class="space-y-6" id="addProductForm">
<!-- Product Identity Section -->
<div class="space-y-4">
<h2 class="font-title-md text-title-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">label</span>
                        General Information
                    </h2>
<!-- Product Name -->
<div class="filled-input-container p-3 group">
<label class="block font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary mb-1">Product Name</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-md font-body-md text-on-surface placeholder:text-outline-variant" placeholder="e.g. Organic Almond Milk" required="" type="text"/>
</div>
<!-- Barcode -->
<div class="flex gap-2">
<div class="filled-input-container p-3 flex-grow group">
<label class="block font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary mb-1">Barcode</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-md font-body-md text-on-surface placeholder:text-outline-variant" placeholder="Scan or enter code" type="text"/>
</div>
<button class="bg-secondary-container text-on-secondary-container rounded-xl w-14 h-14 flex items-center justify-center active:scale-95 transition-transform hover:bg-secondary-fixed-dim" type="button">
<span class="material-symbols-outlined">barcode_scanner</span>
</button>
</div>
</div>
<!-- Categorization -->
<div class="grid grid-cols-2 gap-4">
<div class="filled-input-container p-3 group">
<label class="block font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary mb-1">Category</label>
<select class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-md font-body-md text-on-surface">
<option>Beverages</option>
<option>Dairy</option>
<option>Bakery</option>
<option>Produce</option>
<option>Dry Goods</option>
</select>
</div>
<div class="filled-input-container p-3 group">
<label class="block font-label-sm text-label-sm text-on-surface-variant group-focus-within:text-primary mb-1">Unit</label>
<select class="w-full bg-transparent border-none p-0 focus:ring-0 text-body-md font-body-md text-on-surface">
<option>Piece (pcs)</option>
<option>Kilogram (kg)</option>
<option>Liter (L)</option>
<option>Box</option>
</select>
</div>
</div>
<!-- Pricing Section -->
<div class="space-y-4 pt-2">
<h2 class="font-title-md text-title-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-size: 20px;">payments</span>
                        Pricing &amp; Inventory
                    </h2>
<div class="grid grid-cols-2 gap-4">
<div class="filled-input-container p-3 group">

</div>
<div class="filled-input-container p-3 group">

<span class="material-symbols-outlined">save</span>
            Save Product
        </button>
</div>
<!-- Bottom Navigation Bar (Hidden on this transactional task-focused screen as per mandate) -->
<!-- Suppressed: Relevance Check: Task-Focused with "Back" implied context -->
<script>
        // Micro-interactions for form feedback
        document.getElementById('addProductForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual success state
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Saving...`;
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success`;
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-primary-container');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.remove('opacity-80', 'pointer-events-none', 'bg-primary-container');
                    btn.classList.add('bg-primary');
                }, 2000);
            }, 1200);
        });

        // Offline mode indicator logic simulation
        window.addEventListener('online', updateConnectivity);
        window.addEventListener('offline', updateConnectivity);

        function updateConnectivity() {
            const icon = document.querySelector('header .material-symbols-outlined:last-child');
            if (navigator.onLine) {
                icon.textContent = 'cloud_done';
                icon.className = 'material-symbols-outlined text-primary';
            } else {
                icon.textContent = 'cloud_off';
                icon.className = 'material-symbols-outlined text-outline';
            }
        }
    </script>
