name: stockmesh
description: "StockMesh — fully offline inventory for small shops. One phone is the Hub, others are Clients, syncing over local Wi-Fi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local DB
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  path: ^1.9.0

  # IDs / crypto
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.7.0

  # Serialization
  json_annotation: ^4.9.0

  # Discovery / networking
  bonsoir: ^5.1.11
  network_info_plus: ^6.1.4

  # Device features
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  flutter_foreground_task: ^8.17.0

  # Backup / export
  archive: ^4.0.7
  share_plus: ^10.1.4
  file_picker: ^8.3.7

  # UI utilities
  go_router: ^14.8.1
  intl: ^0.20.2
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^2.9.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
